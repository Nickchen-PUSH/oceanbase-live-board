name: Build data and deploy to GitHub Pages

# 每 10 分钟重新抓一次上游榜单并重新部署：页面是纯静态的，
# 浏览器无法直连 openwebapi.oceanbase.com（非 oceanbase Origin 一律 403），
# 所以抓取只能在 CI 里做。commit 触发的部署用于同步前端改动。
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch snapshot (camp 21, all boards)
        run: node scripts/build-data.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
